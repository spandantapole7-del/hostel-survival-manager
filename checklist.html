<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checklist | Hostel Survival Manager</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>
      body {
        background: #f7f8fc;
      }

      .checklist-layout {
        display: flex;
        min-height: 100vh;
      }

      /* SIDEBAR */

      .sidebar {
        width: 250px;
        background: white;
        border-right: 1px solid #e8eaf0;
        padding: 25px 18px;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
      }

      .sidebar-logo {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 40px;
        padding-left: 12px;
      }

      .sidebar-logo span {
        color: #6c63ff;
      }

      .nav-section {
        margin-bottom: 28px;
      }

      .nav-title {
        font-size: 11px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0 0 12px 12px;
        font-weight: 700;
      }

      .sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #666;
        padding: 13px 14px;
        border-radius: 12px;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
        transition: 0.25s;
      }

      .sidebar a:hover {
        background: #f1efff;
        color: #6c63ff;
        transform: translateX(3px);
      }

      .sidebar a.active {
        background: #eeeaff;
        color: #6c63ff;
      }

      .logout-btn {
        color: #e05252 !important;
        cursor: pointer;
      }

      /* MAIN */

      .main-content {
        margin-left: 250px;
        width: calc(100% - 250px);
        padding: 35px 45px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .page-title h1 {
        margin: 0;
        font-size: 30px;
        color: #222;
      }

      .page-title p {
        margin-top: 7px;
        color: #777;
        font-size: 14px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6c63ff, #9b8cff);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      /* PROGRESS CARD */

      .progress-card {
        background: linear-gradient(135deg, #6c63ff, #857dfc);
        color: white;
        border-radius: 22px;
        padding: 28px;
        margin-bottom: 25px;
        box-shadow: 0 15px 35px rgba(108, 99, 255, 0.18);
      }

      .progress-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .progress-top h2 {
        margin: 0;
        font-size: 20px;
      }

      .progress-percent {
        font-size: 30px;
        font-weight: 800;
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: white;
        border-radius: 20px;
        transition: width 0.4s ease;
      }

      .progress-text {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.9;
      }

      /* ADD ITEM */

      .add-card {
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(30, 35, 60, 0.05);
        margin-bottom: 25px;
      }

      .add-card h2 {
        margin-top: 0;
        font-size: 19px;
      }

      .add-form {
        display: flex;
        gap: 12px;
      }

      .add-form input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid #e2e4ec;
        border-radius: 12px;
        outline: none;
        font-size: 14px;
        transition: 0.2s;
      }

      .add-form input:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
      }

      .add-btn {
        border: none;
        background: #6c63ff;
        color: white;
        padding: 0 25px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      .add-btn:hover {
        background: #574fd6;
        transform: translateY(-2px);
      }

      /* CHECKLIST */

      .checklist-card {
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(30, 35, 60, 0.05);
      }

      .checklist-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .checklist-header h2 {
        margin: 0;
        font-size: 19px;
      }

      .clear-btn {
        border: none;
        background: #fff0f0;
        color: #e05252;
        padding: 9px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }

      .check-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        border: 1px solid #eeeef3;
        border-radius: 14px;
        margin-bottom: 10px;
        transition: 0.2s;
      }

      .check-item:hover {
        background: #fafaff;
        transform: translateY(-1px);
      }

      .item-left {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .item-checkbox {
        width: 20px;
        height: 20px;
        accent-color: #6c63ff;
        cursor: pointer;
      }

      .item-name {
        font-size: 14px;
        color: #333;
        font-weight: 600;
      }

      .check-item.completed .item-name {
        text-decoration: line-through;
        color: #aaa;
      }

      .delete-item {
        border: none;
        background: transparent;
        color: #aaa;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
      }

      .delete-item:hover {
        color: #e05252;
      }

      .empty-state {
        text-align: center;
        padding: 45px 20px;
        color: #999;
      }

      .empty-icon {
        font-size: 45px;
        margin-bottom: 10px;
      }

      .empty-state h3 {
        color: #555;
        margin-bottom: 6px;
      }

      .message {
        margin-top: 12px;
        font-size: 13px;
        color: #6c63ff;
        display: none;
      }

      /* MOBILE */

      @media (max-width: 800px) {
        .sidebar {
          width: 75px;
          padding: 20px 10px;
        }

        .sidebar-logo {
          font-size: 0;
          text-align: center;
        }

        .sidebar-logo span {
          font-size: 20px;
        }

        .sidebar a {
          justify-content: center;
          font-size: 0;
        }

        .sidebar a span {
          font-size: 20px;
        }

        .nav-title {
          display: none;
        }

        .main-content {
          margin-left: 75px;
          width: calc(100% - 75px);
          padding: 25px 20px;
        }

        .add-form {
          flex-direction: column;
        }

        .add-btn {
          padding: 14px;
        }

        .topbar {
          align-items: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <div class="checklist-layout">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="sidebar-logo">Hostel<span>Survival</span></div>

        <div class="nav-section">
          <p class="nav-title">Main</p>

          <a href="dashboard.html">
            <span>🏠</span>
            Dashboard
          </a>

          <a href="budget.html">
            <span>💰</span>
            My Budget
          </a>

          <a href="expenses.html">
            <span>💳</span>
            Expenses
          </a>

          <a href="checklist.html" class="active">
            <span>📋</span>
            Checklist
          </a>
        </div>

        <div class="nav-section">
          <p class="nav-title">Account</p>

          <a href="#" class="logout-btn" id="logoutBtn">
            <span>🚪</span>
            Logout
          </a>
        </div>
      </aside>

      <!-- MAIN CONTENT -->

      <main class="main-content">
        <!-- TOP BAR -->

        <div class="topbar">
          <div class="page-title">
            <h1>Hostel Checklist 📋</h1>
            <p>Keep track of everything you need for hostel life.</p>
          </div>

          <div class="user-info">
            <div>
              <strong id="userName">Student</strong>
            </div>

            <div class="avatar" id="userAvatar">S</div>
          </div>
        </div>

        <!-- PROGRESS -->

        <div class="progress-card">
          <div class="progress-top">
            <h2>Checklist Progress</h2>

            <div class="progress-percent" id="progressPercent">0%</div>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="progress-text" id="progressText">
            0 of 0 items completed
          </div>
        </div>

        <!-- ADD ITEM -->

        <div class="add-card">
          <h2>➕ Add Hostel Item</h2>

          <form id="checklistForm" class="add-form">
            <input
              type="text"
              id="itemInput"
              placeholder="e.g. College ID, Charger, Toiletries..."
              autocomplete="off"
              required
            />

            <button type="submit" class="add-btn">Add Item</button>
          </form>

          <div class="message" id="message"></div>
        </div>

        <!-- CHECKLIST -->

        <div class="checklist-card">
          <div class="checklist-header">
            <h2>📝 My Hostel Items</h2>

            <button class="clear-btn" id="clearBtn">Clear Completed</button>
          </div>

          <div id="checklistContainer">
            <!-- Items generated by JavaScript -->
          </div>
        </div>
      </main>
    </div>

    <script src="js/checklist.js"></script>
  </body>
</html>
