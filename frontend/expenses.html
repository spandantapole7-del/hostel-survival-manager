<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expenses | Hostel Survival Manager</title>

    <link rel="stylesheet" href="CSS/style.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7fc;
        color: #20243a;
        font-family: "Inter", Arial, sans-serif;
      }

      .dashboard-layout {
        display: flex;
        min-height: 100vh;
      }

      /* SIDEBAR */

      .sidebar {
        width: 245px;
        background: white;
        border-right: 1px solid #eceef5;
        padding: 28px 18px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .brand {
        font-size: 19px;
        font-weight: 800;
        padding: 0 12px 35px;
        color: #5b5eea;
      }

      .nav-label {
        font-size: 10px;
        color: #a0a3b5;
        font-weight: 800;
        letter-spacing: 1.4px;
        padding: 0 12px;
        margin-bottom: 12px;
      }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 14px;
        margin-bottom: 6px;
        border-radius: 12px;
        color: #777b90;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: 0.2s;
      }

      .nav-link:hover,
      .nav-link.active {
        background: #eeeeff;
        color: #5b5eea;
      }

      .nav-icon {
        font-size: 17px;
      }

      .sidebar-bottom {
        margin-top: auto;
      }

      .profile-card {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 14px 8px;
        border-top: 1px solid #eeeef4;
        margin-top: 25px;
      }

      .avatar {
        width: 39px;
        height: 39px;
        border-radius: 12px;
        background: #e9e9ff;
        display: grid;
        place-items: center;
        color: #5b5eea;
        font-weight: 800;
      }

      .profile-info strong {
        display: block;
        font-size: 12px;
      }

      .profile-info span {
        font-size: 10px;
        color: #999;
      }

      /* MAIN */

      .main-content {
        flex: 1;
        padding: 35px 42px;
        min-width: 0;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }

      .page-title h1 {
        margin: 0 0 7px;
        font-size: 27px;
      }

      .page-title p {
        margin: 0;
        color: #9295a7;
        font-size: 13px;
      }

      .back-dashboard {
        text-decoration: none;
        color: #6264e9;
        font-size: 12px;
        font-weight: 700;
      }

      /* SUMMARY */

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 22px;
      }

      .summary-card {
        background: white;
        border: 1px solid #eeeef4;
        border-radius: 17px;
        padding: 20px;
      }

      .summary-label {
        color: #999cad;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .summary-value {
        margin-top: 8px;
        font-size: 24px;
        font-weight: 800;
      }

      /* CONTENT */

      .expenses-grid {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        max-width: 1150px;
      }

      .panel {
        background: white;
        border: 1px solid #eeeef4;
        border-radius: 20px;
        padding: 25px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 23px;
      }

      .panel-header h2 {
        font-size: 15px;
        margin: 0;
      }

      /* FORM */

      .form-group {
        margin-bottom: 17px;
      }

      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #45485d;
        margin-bottom: 8px;
      }

      .form-input,
      .form-select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #e5e7ef;
        border-radius: 11px;
        background: #fafaff;
        outline: none;
        font-size: 12px;
        color: #33364a;
        transition: 0.2s;
      }

      .form-input:focus,
      .form-select:focus {
        background: white;
        border-color: #7776ed;
        box-shadow: 0 0 0 4px rgba(119, 118, 237, 0.1);
      }

      .add-button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366e8, #8b5cf6);
        color: white;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 9px 22px rgba(99, 102, 241, 0.2);
      }

      .add-button:hover {
        transform: translateY(-2px);
      }

      /* MESSAGE */

      .message {
        display: none;
        padding: 11px 13px;
        border-radius: 10px;
        margin-bottom: 17px;
        font-size: 11px;
      }

      .message.success {
        display: block;
        background: #ecfdf5;
        color: #078457;
      }

      .message.error {
        display: block;
        background: #fff0f0;
        color: #c43e43;
      }

      /* FILTER */

      .filter-select {
        padding: 9px 12px;
        border: 1px solid #e5e7ef;
        border-radius: 9px;
        background: #fafaff;
        font-size: 11px;
        color: #55586d;
        outline: none;
      }

      /* EXPENSE LIST */

      .expense-list {
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      .expense-item {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px;
        border: 1px solid #f0f0f5;
        border-radius: 13px;
        transition: 0.2s;
      }

      .expense-item:hover {
        background: #fafaff;
        border-color: #e2e1f7;
      }

      .expense-icon {
        width: 43px;
        height: 43px;
        border-radius: 12px;
        background: #eeeeff;
        display: grid;
        place-items: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .expense-info {
        flex: 1;
        min-width: 0;
      }

      .expense-name {
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 5px;
      }

      .expense-meta {
        font-size: 10px;
        color: #9b9dad;
      }

      .expense-amount {
        font-size: 13px;
        font-weight: 800;
        margin-right: 8px;
      }

      .delete-button {
        width: 31px;
        height: 31px;
        border: none;
        border-radius: 9px;
        background: #fff1f1;
        color: #d85858;
        cursor: pointer;
        transition: 0.2s;
      }

      .delete-button:hover {
        background: #ffe0e0;
      }

      .empty-state {
        padding: 45px 20px;
        text-align: center;
        color: #999cad;
        font-size: 12px;
        line-height: 1.7;
      }

      .empty-icon {
        font-size: 35px;
        margin-bottom: 12px;
      }

      /* RESPONSIVE */

      @media (max-width: 950px) {
        .expenses-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .sidebar {
          width: 75px;
          padding: 20px 9px;
        }

        .brand {
          font-size: 0;
          text-align: center;
        }

        .brand::first-letter {
          font-size: 22px;
        }

        .nav-label,
        .nav-link span:last-child,
        .profile-info {
          display: none;
        }

        .nav-link {
          justify-content: center;
        }

        .profile-card {
          justify-content: center;
        }

        .main-content {
          padding: 22px 16px;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          gap: 15px;
          flex-direction: column;
        }
      }

      @media (max-width: 450px) {
        .expense-item {
          gap: 8px;
          padding: 11px;
        }

        .expense-amount {
          font-size: 11px;
        }

        .expense-icon {
          width: 37px;
          height: 37px;
        }
      }
    </style>
  </head>

  <body>
    <div class="dashboard-layout">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="brand">🏠 HostelSurvival</div>

        <div class="nav-label">MAIN MENU</div>

        <a href="dashboard.html" class="nav-link">
          <span class="nav-icon">▦</span>
          <span>Dashboard</span>
        </a>

        <a href="budget.html" class="nav-link">
          <span class="nav-icon">💰</span>
          <span>My Budget</span>
        </a>

        <a href="expenses.html" class="nav-link active">
          <span class="nav-icon">💳</span>
          <span>Expenses</span>
        </a>

        <a href="checklist.html" class="nav-link">
          <span class="nav-icon">☑</span>
          <span>Checklist</span>
        </a>

        <div class="sidebar-bottom">
          <div class="nav-label">ACCOUNT</div>

          <a href="#" class="nav-link" id="logoutButton">
            <span class="nav-icon">↪</span>
            <span>Log out</span>
          </a>

          <div class="profile-card">
            <div class="avatar" id="userAvatar">S</div>

            <div class="profile-info">
              <strong id="sidebarName"> Student </strong>

              <span> Hostel Student </span>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN -->

      <main class="main-content">
        <div class="topbar">
          <div class="page-title">
            <h1>Expenses 💳</h1>

            <p>Keep track of every rupee you spend.</p>
          </div>

          <a href="dashboard.html" class="back-dashboard"> ← Dashboard </a>
        </div>

        <!-- SUMMARY -->

        <section class="summary-grid">
          <div class="summary-card">
            <div class="summary-label">TOTAL SPENT</div>

            <div class="summary-value" id="totalSpent">₹0</div>
          </div>

          <div class="summary-card">
            <div class="summary-label">EXPENSES RECORDED</div>

            <div class="summary-value" id="expenseCount">0</div>
          </div>

          <div class="summary-card">
            <div class="summary-label">REMAINING BALANCE</div>

            <div class="summary-value" id="remainingBalance">₹0</div>
          </div>
        </section>

        <!-- CONTENT -->

        <section class="expenses-grid">
          <!-- ADD EXPENSE -->

          <div class="panel">
            <div class="panel-header">
              <h2>Add expense</h2>

              <span style="font-size: 20px"> ➕ </span>
            </div>

            <div id="expenseMessage" class="message"></div>

            <form id="expenseForm">
              <div class="form-group">
                <label for="expenseName"> Expense Name </label>

                <input
                  type="text"
                  id="expenseName"
                  class="form-input"
                  placeholder="e.g. Lunch"
                  maxlength="50"
                  required
                />
              </div>

              <div class="form-group">
                <label for="expenseAmount"> Amount </label>

                <input
                  type="number"
                  id="expenseAmount"
                  class="form-input"
                  placeholder="120"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <div class="form-group">
                <label for="expenseCategory"> Category </label>

                <select id="expenseCategory" class="form-select" required>
                  <option value="">Select category</option>

                  <option value="Food">🍔 Food</option>

                  <option value="Travel">🚌 Travel</option>

                  <option value="Shopping">🛍️ Shopping</option>

                  <option value="Education">📚 Education</option>

                  <option value="Other">💳 Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="expenseDate"> Date </label>

                <input
                  type="date"
                  id="expenseDate"
                  class="form-input"
                  required
                />
              </div>

              <button type="submit" class="add-button">Add Expense →</button>
            </form>
          </div>

          <!-- EXPENSE LIST -->

          <div class="panel">
            <div class="panel-header">
              <h2>Expense history</h2>

              <select id="categoryFilter" class="filter-select">
                <option value="All">All categories</option>

                <option value="Food">Food</option>

                <option value="Travel">Travel</option>

                <option value="Shopping">Shopping</option>

                <option value="Education">Education</option>

                <option value="Other">Other</option>
              </select>
            </div>

            <div class="expense-list" id="expenseList"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="JS/api.js"></script>
    <script src="JS/expenses.js"></script>
  </body>
</html>
